name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Compatible Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.4.2'

      - name: Create Mock google-services.json
        run: |
          mkdir -p app
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "photo-viewer-dummy",
              "storage_bucket": "photo-viewer-dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.devdutt.photoviewer"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "dummy_key_for_compilation"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoViewer-APK
          path: "**/build/outputs/apk/debug/*.apk"
